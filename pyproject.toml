[project]
name = "ai-vs-human-text"
version = "1.0.0"
description = "Detecting AI-generated essays from how people write: stylometric features + logistic regression"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "scikit-learn>=1.3", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "kaggle>=1.6"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
